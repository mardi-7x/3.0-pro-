services:
  - type: web
    name: morning-intelligence-2
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: DAILY_HOUR
        value: "9"
      - key: DAILY_MINUTE
        value: "30"
      - key: DATA_DIR
        value: data
